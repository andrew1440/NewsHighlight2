{% extends 'base.html' %}
{% import "macro.html" as macro %}
{% block content %}
<div class="container my-5">
  <h1 class="text-center mb-4">News Sources</h1>
  <div class="row">
    {% if news %}
        {{macro.displayNews(news)}}
    {% else %}
        <div class="col-12">
          <h3 class="text-center">No news sources available</h3>
        </div>
    {% endif %}
  </div>
</div>
{% endblock %}
