{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
  <h1 class="text-center mb-4">Latest Articles</h1>
  <div class="row">
    {% for display in articles %}
      <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100">
          {% if display.urlToImage %}
            <img src="{{ display.urlToImage }}" class="card-img-top" alt="Article Image">
          {% endif %}
          <div class="card-body">
            <h5 class="card-title">{{ display.title }}</h5>
            <p class="card-text">{{ display.description }}</p>
            <p class="text-muted small">{{ display.publishedAt }}</p>
            <a href="{{ display.url }}" class="btn btn-primary" target="_blank">Read More</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
