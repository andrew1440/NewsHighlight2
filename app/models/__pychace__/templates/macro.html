{% macro displayNews(news) %}
{% for display in news %}
  <div class="col-md-6 col-lg-4 mb-4">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">{{ display.name }}</h5>
        <p class="card-text">{{ display.description }}</p>
        <a href="/source/{{ display.id }}" class="btn btn-primary">View Articles</a>
      </div>
    </div>
  </div>
{% endfor %}
{% endmacro %}
